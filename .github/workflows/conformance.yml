name: TECR-L4 Conformance Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  conformance:
    name: TECR-L4 Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      TECR_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run conformance gate
        run: pnpm gate

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: results.json
          if-no-files-found: ignore
